<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Perspective — карточки вдохновения</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#f5f1e9;background:#111317}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 10%,#34303d 0,transparent 55%),#111317;display:grid;place-items:center;padding:28px}.app{width:min(100%,520px);text-align:center}.eyebrow{font-size:12px;letter-spacing:.24em;color:#c7aa80;text-transform:uppercase;font-weight:700}h1{font-size:clamp(36px,7vw,56px);letter-spacing:-.06em;margin:12px 0 8px}.intro{color:#a6a4ad;margin:0 0 30px;line-height:1.5}.card{background:#24252b;border:1px solid #ffffff20;border-radius:26px;overflow:hidden;text-align:left;box-shadow:0 28px 75px #0008;transition:opacity .2s,transform .2s}.card.out{opacity:0;transform:translateX(-25px) rotate(-3deg)}.photo{height:330px;background:#333;position:relative;overflow:hidden}.photo img{width:100%;height:100%;object-fit:cover;object-position:center 32%;filter:grayscale(100%);display:block}.photo:after{content:"";position:absolute;inset:50% 0 0;background:linear-gradient(transparent,#24252b)}.number{position:absolute;top:18px;left:20px;background:#111a;color:#fff;border:1px solid #fff3;border-radius:30px;padding:8px 13px;font-size:12px}.content{padding:0 28px 30px;position:relative;margin-top:-32px}.tag{color:#d6b183;text-transform:uppercase;letter-spacing:.15em;font-size:11px;font-weight:700}h2{font-size:36px;letter-spacing:-.04em;margin:8px 0}.description{color:#c2c0c6;line-height:1.6;margin:0 0 22px;min-height:50px}.question{border-top:1px solid #ffffff24;padding-top:20px;font-size:18px;line-height:1.45;font-weight:600}.question span{display:block;color:#d6b183;font-size:11px;text-transform:uppercase;letter-spacing:.12em;margin-bottom:9px}.controls{display:flex;gap:12px;margin-top:20px}.btn{border:0;border-radius:14px;padding:17px 20px;font-size:15px;font-weight:750;cursor:pointer}.next{flex:1;background:#e7c498;color:#1b1715}.next:hover{background:#f6d8ae}.back{background:#ffffff16;color:#eee;border:1px solid #ffffff22}.back:disabled{opacity:.35;cursor:not-allowed}.hint{font-size:12px;color:#777782;margin-top:20px}@media(max-width:460px){.photo{height:280px}.content{padding:0 22px 24px}h2{font-size:30px}}
</style>
</head>
<body><main class="app"><div class="eyebrow">Creative thinking experiment</div><h1>Perspective.</h1><p class="intro">А что, если взглянуть на свою задачу<br>глазами кого-то другого?</p><article class="card" id="card"><div class="photo"><img id="portrait" alt="Портрет" referrerpolicy="no-referrer"><span class="number" id="counter"></span></div><div class="content"><div class="tag" id="role"></div><h2 id="name"></h2><p class="description" id="description"></p><div class="question"><span>Спроси себя</span><div id="question"></div></div></div></article><div class="controls"><button class="btn back" id="back">← Назад</button><button class="btn next" id="next">Другой человек →</button></div><div class="hint">Нажми → или пробел, чтобы сменить карточку</div></main>
<script>
const people=[
{name:'Альберт Эйнштейн',role:'Физик · Исследователь',description:'Умел находить необычные ответы, задавая простые вопросы.',question:'Как бы ты решил эту задачу, если бы забыл все привычные правила?',image:'https://upload.wikimedia.org/wikipedia/commons/d/d3/Albert_Einstein_Head.jpg'},
{name:'Фрида Кало',role:'Художница · Новатор',description:'Превращала личный опыт в смелое, узнаваемое искусство.',question:'Как превратить свою уникальную историю в главное преимущество?',image:'https://upload.wikimedia.org/wikipedia/commons/1/15/Frida_Kahlo%2C_by_Guillermo_Kahlo.jpg'},
{name:'Стив Джобс',role:'Предприниматель · Визионер',description:'Стремился превращать сложные технологии в простые и понятные продукты.',question:'Что можно убрать, чтобы идея стала по-настоящему простой?',image:'https://upload.wikimedia.org/wikipedia/commons/f/f5/Steve_Jobs_Headshot_2010-CROP2.jpg'},
{name:'Мария Кюри',role:'Учёная · Первооткрыватель',description:'Продолжала исследования, несмотря на препятствия и сомнения окружающих.',question:'Какой эксперимент ты бы провёл, если бы не боялся ошибиться?',image:'https://upload.wikimedia.org/wikipedia/commons/c/c8/Marie_Curie_c._1920s.jpg'},
{name:'Никола Тесла',role:'Изобретатель · Инженер',description:'Воображал невероятные технические решения задолго до их появления.',question:'Как выглядело бы радикально новое решение этой проблемы?',image:'https://upload.wikimedia.org/wikipedia/commons/d/d4/N.Tesla.JPG'},
{name:'Леонардо да Винчи',role:'Художник · Изобретатель',description:'Соединял искусство, науку и наблюдение за природой.',question:'Какую идею можно позаимствовать из совершенно другой области?',image:'https://upload.wikimedia.org/wikipedia/commons/b/ba/Leonardo_self.jpg'},
{name:'Ада Лавлейс',role:'Математик · Пионер вычислений',description:'Предвидела творческие возможности вычислительных машин.',question:'Какие возможности скрыты в технологии, которую все используют одинаково?',image:'https://upload.wikimedia.org/wikipedia/commons/a/a4/Ada_Lovelace_portrait.jpg'}
];
let deck=[],history=[],index=-1;const $=id=>document.getElementById(id);function shuffle(){deck=[...people.keys()];for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}}function render(){const p=people[history[index]];$('portrait').src=p.image;$('portrait').alt=p.name;$('portrait').onerror=()=>{$('portrait').style.opacity='0';$('portrait').parentNode.style.background='linear-gradient(135deg,#79634c,#24252b)'};$('portrait').onload=()=>{$('portrait').style.opacity='1'};$('name').textContent=p.name;$('role').textContent=p.role;$('description').textContent=p.description;$('question').textContent=p.question;$('counter').textContent=`${String(index+1).padStart(2,'0')} / ${String(people.length).padStart(2,'0')}`;$('back').disabled=index===0}function transition(action){$('card').classList.add('out');setTimeout(()=>{action();render();$('card').classList.remove('out')},190)}function next(){transition(()=>{if(index<history.length-1){index++;return}if(!deck.length)shuffle();if(history.length){const last=history[index];if(deck.length>1&&deck[deck.length-1]===last)[deck[deck.length-1],deck[0]]=[deck[0],deck[deck.length-1]]}history.push(deck.pop());index++})}function back(){if(index>0)transition(()=>index--)}$('next').onclick=next;$('back').onclick=back;document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.code==='Space'){if(e.code==='Space')e.preventDefault();next()}if(e.key==='ArrowLeft')back()});shuffle();history.push(deck.pop());index=0;render();
</script></body></html>
